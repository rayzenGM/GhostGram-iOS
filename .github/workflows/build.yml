name: GhostGram iOS build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghostgram-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Telegram secrets
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          valid = (re.fullmatch(r'[1-9][0-9]*', os.environ.get('TELEGRAM_API_ID', ''))
                   and re.fullmatch(r'[0-9a-fA-F]{32}', os.environ.get('TELEGRAM_API_HASH', '')))
          if not valid:
              sys.exit('Add valid TELEGRAM_API_ID and TELEGRAM_API_HASH repository secrets.')
          print('Both Telegram secrets are present and have the expected format.')
          PY

      - name: Select required Xcode
        run: |
          python3 - <<'PY'
          import glob, json, os, subprocess, sys
          required = json.load(open('versions.json'))['xcode']
          for app in sorted(glob.glob('/Applications/Xcode*.app')):
              developer = app + '/Contents/Developer'
              env = dict(os.environ, DEVELOPER_DIR=developer)
              version = subprocess.check_output(['xcodebuild', '-version'], env=env, text=True).splitlines()[0]
              print(app, version)
              if version == 'Xcode ' + required:
                  with open(os.environ['GITHUB_ENV'], 'a') as output:
                      output.write('DEVELOPER_DIR=' + developer + '\n')
                  break
          else:
              sys.exit('This source requires Xcode ' + required + ', which is absent on this runner.')
          PY

      - name: Restore Bazel cache
        id: bazel-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/telegram-bazel-cache
          key: ${{ runner.os }}-${{ runner.arch }}-ghostgram-bazel-v1-${{ hashFiles('versions.json', 'MODULE.bazel', 'MODULE.bazel.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ghostgram-bazel-v1-${{ hashFiles('versions.json', 'MODULE.bazel', 'MODULE.bazel.lock') }}-

      - name: Fetch source dependencies
        run: |
          # Upstream's relative URL otherwise resolves to rayzenGM/tgcalls in a fork.
          git submodule init
          git config submodule.submodules/TgVoipWebrtc/tgcalls.url https://github.com/TelegramMessenger/tgcalls.git
          git submodule update --init --recursive --jobs 4

      - name: Prepare build configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path('build-system/appstore-configuration.json').read_text())
          config['api_id'] = os.environ['TELEGRAM_API_ID']
          config['api_hash'] = os.environ['TELEGRAM_API_HASH']
          config['is_appstore_build'] = 'false'
          config['app_specific_url_scheme'] = 'ghostgram'
          config['enable_siri'] = False
          config['enable_icloud'] = False
          # Keep the verification profiles' bundle/team IDs for this first build.
          # The IPA must be re-signed with an Apple identity before installation.
          destination = Path(os.environ['RUNNER_TEMP']) / 'ghostgram-configuration.json'
          destination.write_text(json.dumps(config), encoding='utf-8')
          destination.chmod(0o600)
          PY
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

      - name: Build device IPA for re-signing
        id: build-ipa
        run: |
          python3 -u build-system/Make/Make.py \
            --cacheDir="$RUNNER_TEMP/telegram-bazel-cache" \
            build \
            --configurationPath="$RUNNER_TEMP/ghostgram-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$GITHUB_RUN_NUMBER"
          test -s bazel-bin/Telegram/Telegram.ipa

      - name: Save IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostGram-needs-resigning-${{ github.run_number }}
          path: bazel-bin/Telegram/Telegram.ipa
          if-no-files-found: error
          retention-days: 3

      # Keep completed compilation work even if a later compiler action fails.
      # Cache entries are immutable, so each attempt writes a new key and restores
      # the newest compatible entry using the toolchain prefix above.
      - name: Save Bazel cache (including failed builds)
        if: ${{ always() && !cancelled() && (steps.build-ipa.outcome == 'success' || steps.build-ipa.outcome == 'failure') }}
        uses: actions/cache/save@v4
        continue-on-error: true
        timeout-minutes: 20
        with:
          path: ${{ runner.temp }}/telegram-bazel-cache
          key: ${{ runner.os }}-${{ runner.arch }}-ghostgram-bazel-v1-${{ hashFiles('versions.json', 'MODULE.bazel', 'MODULE.bazel.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove temporary API configuration
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'ghostgram-configuration.json').unlink(missing_ok=True)
          PY
